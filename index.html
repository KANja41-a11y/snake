<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Gemes 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(160deg, #fff0f5 0%, #fce7f3 30%, #ede9fe 70%, #e0f2fe 100%);
      color: #5b4b6e;
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(244, 114, 182, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(167, 139, 250, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 70% 80%, rgba(125, 211, 252, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 15% 75%, rgba(253, 186, 116, 0.1) 0%, transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ec4899, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #a78bfa;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .score-board {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .score-board span {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid rgba(244, 114, 182, 0.25);
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.1);
      color: #be185d;
    }

    .score-board strong {
      color: #ec4899;
    }

    #gameCanvas {
      background: linear-gradient(180deg, #fff5f8 0%, #fdf2f8 100%);
      border: 4px solid #f9a8d4;
      border-radius: 20px;
      box-shadow:
        0 10px 30px rgba(236, 72, 153, 0.15),
        0 0 0 6px rgba(255, 255, 255, 0.6),
        inset 0 0 20px rgba(253, 164, 175, 0.15);
      max-width: 92vw;
      max-height: 55vh;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 80px;
      user-select: none;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
    }

    button:active {
      transform: scale(0.94);
    }

    button.secondary {
      background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      box-shadow: 0 4px 14px rgba(167, 139, 250, 0.35);
    }

    .d-pad {
      display: grid;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 48px 48px 48px;
      gap: 6px;
      margin-top: 6px;
    }

    .d-pad button {
      padding: 0;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: unset;
      background: linear-gradient(135deg, #fda4af, #fb7185);
      box-shadow: 0 3px 10px rgba(251, 113, 133, 0.3);
    }

    .d-pad .up    { grid-column: 2; grid-row: 1; }
    .d-pad .left  { grid-column: 1; grid-row: 2; }
    .d-pad .down  { grid-column: 2; grid-row: 2; }
    .d-pad .right { grid-column: 3; grid-row: 2; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 240, 245, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-card {
      background: white;
      padding: 32px 40px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(236, 72, 153, 0.18);
      text-align: center;
      border: 3px solid #fbcfe8;
      max-width: 90vw;
    }

    .overlay h2 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ec4899, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .overlay p {
      margin-bottom: 22px;
      color: #9d7ab8;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #c4b5fd;
      text-align: center;
      max-width: 280px;
      font-weight: 600;
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 14px;
      animation: sparkleUp 0.7s ease-out forwards;
      z-index: 5;
    }

    @keyframes sparkleUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(0.4); }
    }

    @media (min-width: 600px) {
      .d-pad { display: none; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🐍💕 Snake Gemes</h1>
    <p class="subtitle">ular imut yang lapar hati~</p>

    <div class="score-board">
      <span>Skor: <strong id="score">0</strong></span>
      <span>High: <strong id="highScore">0</strong></span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
      <div class="btn-row">
        <button id="startBtn">Mulai ✨</button>
        <button id="pauseBtn" class="secondary">Pause</button>
      </div>

      <div class="d-pad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="down" data-dir="down">▼</button>
        <button class="right" data-dir="right">▶</button>
      </div>

      <p class="hint">Keyboard: ← ↑ → ↓ atau WASD<br>HP: pakai tombol di atas 💕</p>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">Snake Gemes 💕</h2>
      <p id="overlayMsg">Ayo main, kumpulkan hati!</p>
      <button id="overlayBtn">Mulai Main ✨</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMsg = document.getElementById('overlayMsg');
    const overlayBtn = document.getElementById('overlayBtn');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const GRID = 20;
    const TILE = canvas.width / GRID;
    let snake, food, direction, nextDirection, score, highScore, gameLoop, isPaused, isRunning;

    highScore = parseInt(localStorage.getItem('snakeGemesHigh') || '0');
    highScoreEl.textContent = highScore;

    const colors = {
      grid: 'rgba(251, 207, 232, 0.45)',
      snakeHead: '#4ade80',
      snakeBody: ['#86efac', '#6ee7b7', '#5eead4'],
      food: '#f472b6',
      foodGlow: 'rgba(244, 114, 182, 0.35)',
      eye: '#1e1b4b'
    };

    function initGame() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      isPaused = false;
      isRunning = true;
      placeFood();
      overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 115);
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
    }

    function spawnSparkles(x, y) {
      const emojis = ['✨', '💕', '⭐', '🌸', '💖'];
      for (let i = 0; i < 5; i++) {
        const el = document.createElement('div');
        el.className = 'sparkle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const rect = canvas.getBoundingClientRect();
        el.style.left = (rect.left + x * TILE + TILE / 2 + (Math.random() - 0.5) * 30) + 'px';
        el.style.top = (rect.top + y * TILE + TILE / 2) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
      }
    }

    function update() {
      if (isPaused || !isRunning) return;

      direction = { ...nextDirection };

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        gameOver();
        return;
      }

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snakeGemesHigh', highScore);
        }
        spawnSparkles(food.x, food.y);
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function drawHeart(cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(size / 20, size / 20);
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-12, -6, -12, -14, 0, -8);
      ctx.bezierCurveTo(12, -14, 12, -6, 0, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#fff8fb');
      grad.addColorStop(1, '#fdf2f8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE, 0);
        ctx.lineTo(i * TILE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * TILE);
        ctx.lineTo(canvas.width, i * TILE);
        ctx.stroke();
      }

      // Food glow
      ctx.beginPath();
      ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, TILE * 0.7, 0, Math.PI * 2);
      ctx.fillStyle = colors.foodGlow;
      ctx.fill();

      // Heart food
      ctx.fillStyle = colors.food;
      drawHeart(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2 + 1, TILE * 0.85);

      // Shine on heart
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(food.x * TILE + TILE / 2 - 3, food.y * TILE + TILE / 2 - 4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        const px = seg.x * TILE;
        const py = seg.y * TILE;

        if (i === 0) {
          // Head
          ctx.fillStyle = colors.snakeHead;
          ctx.beginPath();
          ctx.roundRect(px + 2, py + 2, TILE - 4, TILE - 4, 10);
          ctx.fill();

          // Highlight
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.beginPath();
          ctx.ellipse(px + TILE * 0.38, py + TILE * 0.32, 5, 3.5, -0.4, 0, Math.PI * 2);
          ctx.fill();

          // Eyes follow direction
          const eyeOffset = direction.x !== 0
            ? { x: direction.x * 3, y: 0 }
            : { x: 0, y: direction.y * 2 };

          // White eyes
          ctx.fillStyle = 'white';
          ctx.beginPath();
          ctx.arc(px + 7 + eyeOffset.x, py + 8 + eyeOffset.y, 3.8, 0, Math.PI * 2);
          ctx.arc(px + 13 + eyeOffset.x, py + 8 + eyeOffset.y, 3.8, 0, Math.PI * 2);
          ctx.fill();

          // Pupils
          ctx.fillStyle = colors.eye;
          ctx.beginPath();
          ctx.arc(px + 7.5 + eyeOffset.x + direction.x, py + 8.2 + eyeOffset.y + direction.y * 0.5, 2.1, 0, Math.PI * 2);
          ctx.arc(px + 13.5 + eyeOffset.x + direction.x, py + 8.2 + eyeOffset.y + direction.y * 0.5, 2.1, 0, Math.PI * 2);
          ctx.fill();

          // Eye shine
          ctx.fillStyle = 'white';
          ctx.beginPath();
          ctx.arc(px + 6.5 + eyeOffset.x, py + 7 + eyeOffset.y, 1, 0, Math.PI * 2);
          ctx.arc(px + 12.5 + eyeOffset.x, py + 7 + eyeOffset.y, 1, 0, Math.PI * 2);
          ctx.fill();

          // Blush
          ctx.fillStyle = 'rgba(253, 164, 175, 0.7)';
          ctx.beginPath();
          ctx.ellipse(px + 5, py + 14, 3.5, 2, 0, 0, Math.PI * 2);
          ctx.ellipse(px + 15, py + 14, 3.5, 2, 0, 0, Math.PI * 2);
          ctx.fill();

          // Smile
          ctx.strokeStyle = '#166534';
          ctx.lineWidth = 1.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(px + TILE / 2, py + 15, 3, 0.15, Math.PI - 0.15);
          ctx.stroke();

        } else {
          // Body
          const colorIdx = (i - 1) % colors.snakeBody.length;
          ctx.fillStyle = colors.snakeBody[colorIdx];
          ctx.beginPath();
          ctx.roundRect(px + 3, py + 3, TILE - 6, TILE - 6, 8);
          ctx.fill();

          // Soft highlight
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.beginPath();
          ctx.roundRect(px + 5, py + 5, TILE - 12, 5, 4);
          ctx.fill();
        }
      });
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      overlayTitle.textContent = 'Yahh kalah 🥺';
      overlayMsg.textContent = `Skor kamu: ${score} 💕`;
      overlayBtn.textContent = 'Main Lagi ✨';
      overlay.classList.remove('hidden');
    }

    function changeDirection(dir) {
      if (!isRunning || isPaused) return;
      const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
      const current = direction.x === 1 ? 'right' : direction.x === -1 ? 'left' : direction.y === -1 ? 'up' : 'down';
      if (dir === opposites[current]) return;

      if (dir === 'up') nextDirection = { x: 0, y: -1 };
      if (dir === 'down') nextDirection = { x: 0, y: 1 };
      if (dir === 'left') nextDirection = { x: -1, y: 0 };
      if (dir === 'right') nextDirection = { x: 1, y: 0 };
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (['arrowup', 'w'].includes(key)) { e.preventDefault(); changeDirection('up'); }
      if (['arrowdown', 's'].includes(key)) { e.preventDefault(); changeDirection('down'); }
      if (['arrowleft', 'a'].includes(key)) { e.preventDefault(); changeDirection('left'); }
      if (['arrowright', 'd'].includes(key)) { e.preventDefault(); changeDirection('right'); }
      if (key === ' ' || key === 'p') {
        e.preventDefault();
        togglePause();
      }
    });

    document.querySelectorAll('.d-pad button').forEach(btn => {
      btn.addEventListener('click', () => changeDirection(btn.dataset.dir));
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        changeDirection(btn.dataset.dir);
      }, { passive: false });
    });

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
    }

    startBtn.addEventListener('click', initGame);
    overlayBtn.addEventListener('click', initGame);
    pauseBtn.addEventListener('click', togglePause);

    // Initial draw (empty board look)
    food = { x: 15, y: 10 };
    snake = [{ x: 10, y: 10 }];
    direction = { x: 1, y: 0 };
    draw();
  </script>
</body>
</html>
